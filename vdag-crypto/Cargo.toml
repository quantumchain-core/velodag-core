[package]
name = "vdag-crypto"
version = "0.1.0"
edition = "2021"

[features]
default = []
shielded = []
halo2 = ["shielded", "dep:halo2_proofs", "dep:halo2curves"]

[dependencies]
# Post-Quantum NIST Standard (ML-DSA / CRYSTALS-Dilithium)
pqcrypto-dilithium = "0.5.0"
pqcrypto-traits = "0.3.5"
curve25519-dalek = { version = "4.1", features = ["digest"] }
rand = "0.8"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
sled = "0.34"
bincode = "1.3"

# Zero-Knowledge & High-Speed Cryptographic Math
ark-ff = "0.4.2"
ark-ec = "0.4.2"
sha3 = "0.10.8"
halo2_proofs = { version = "0.3", optional = true }
halo2curves = { version = "0.7", optional = true }
