[package]
name = "vdag-consensus"
version = "0.1.0"
edition = "2021"

[features]
default = []
shielded = ["vdag-crypto/shielded"]
halo2 = ["shielded", "vdag-crypto/halo2"]

[dependencies]
sha3 = "0.10.8"
sled = "0.34.7"
vdag-crypto = { path = "../vdag-crypto" }
blake3 = "1.5"

# Used to serialize structural block objects into binary bytes for the database disk
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[dev-dependencies]
# Property-based / adversarial testing: generates a wide space of random
# inputs (including malformed byte sequences and extreme numeric values)
# rather than relying only on hand-picked test cases. This is what caught
# the shift-overflow bug in calculate_subsidy_split -- a hand-picked test
# at height=1 or the era boundary would never have exercised era >= 64.
proptest = "1.4"
