[package]
name = "vdag-node"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace Crate Links
vdag-consensus = { path = "../vdag-consensus" }
vdag-crypto = { path = "../vdag-crypto" }
vdag-network = { path = "../vdag-network" }

# External System Async & Serde Toolchains
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
hex = "0.4"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# Structured logging (subscriber is initialized in main.rs;
# existing println! call sites can be migrated to tracing:: incrementally)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Networking Suite
# - "macros" is required for #[derive(NetworkBehaviour)] on the composed VeloBehaviour
# - "mdns" enables LAN peer auto-discovery
# - "request-response" + "json" back the block-sync catch-up protocol
libp2p = { version = "0.53.2", features = [
    "gossipsub",
    "tcp",
    "noise",
    "yamux",
    "mdns",
    "tokio",
    "macros",
    "request-response",
    "json",
] }
