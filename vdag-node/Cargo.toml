[package]
name = "vdag-node"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace Crate Links
vdag-consensus = { path = "../vdag-consensus" }
vdag-crypto = { path = "../vdag-crypto" }
vdag-network = { path = "../vdag-network" }

# External System Async & Serde Toolchains
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
hex = "0.4"

# Networking Suite
libp2p = { version = "0.53.2", features = ["gossipsub", "tcp", "noise", "yamux", "mdns", "tokio"] }
